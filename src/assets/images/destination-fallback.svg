<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02120d" />
      <stop offset="50%" stop-color="#042217" />
      <stop offset="100%" stop-color="#020f0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#042217" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="210" r="240" fill="url(#glowGrad)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Distant Mountain Ridges -->
  <path d="M0 380 Q 180 300 340 350 T 620 320 T 800 370 L 800 500 L 0 500 Z" fill="#041a12" opacity="0.6" />
  <path d="M0 410 Q 240 340 480 390 T 800 390 L 800 500 L 0 500 Z" fill="#031510" opacity="0.9" />

  <!-- Stylized Heritage Arch & Compass Motif -->
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- Outer Decorative Arch -->
    <path d="M -70 50 A 70 70 0 0 1 70 50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 4" />
    <!-- Inner Arch -->
    <path d="M -50 50 A 50 50 0 0 1 50 50 L 50 60 L -50 60 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Central Compass Star -->
    <circle cx="0" cy="0" r="28" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1.5" />
    <polygon points="0,-22 5,-6 21,0 5,6 0,22 -5,6 -21,0 -5,-6" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Text Hierarchy -->
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    INDIA EXPLORER
  </text>
  <text x="400" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#fbd38d" letter-spacing="2" text-transform="uppercase">
    Destination Preview
  </text>
  <text x="400" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(167,243,208,0.65)" letter-spacing="0.5">
    Photograph Loading / Connecting to Heritage Archive
  </text>
</svg>
